name: Keep sync server awake
# Free Supabase projects pause after a week with no traffic. One tiny request a day prevents that.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -sf -X POST "https://hntfewibvzsbuaazbiqj.supabase.co/rest/v1/rpc/server_time" \
            -H "apikey: sb_publishable_UVjTU4zxYZ__GbUqJXmM8w_XAeYM8cG" \
            -H "Content-Type: application/json" -d '{}'
